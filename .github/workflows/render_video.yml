name: Render Faceless Video

on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (FFmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick

      - name: Configure ImageMagick
        run: |
          sudo sed -i 's/none/read,write/g' /etc/ImageMagick-6/policy.xml || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install edge-tts moviepy==1.0.3 requests Pillow numpy

      - name: Save Video Payload to JSON
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: echo "$PAYLOAD" > video_payload.json

      - name: Run Video Generator Script
        run: python scripts/render_faceless.py

      - name: Upload Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: reel_final_linkedin
          path: reel_final_linkedin.mp4
          retention-days: 7

      - name: Upload Video and Notify Webhook
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          if [ -n "$WORKER_URL" ]; then
            echo "Subiendo MP4 a tmpfiles.org..."
            RESPONSE=$(curl -s -F "file=@reel_final_linkedin.mp4" https://tmpfiles.org/api/v1/upload)
            URL=$(echo $RESPONSE | jq -r .data.url | sed 's/tmpfiles.org/tmpfiles.org\/dl/')
            echo "Uploaded to: $URL"
            POST_ID=$(jq -r .postId video_payload.json)
            echo "Notificando a Cloudflare Worker: $WORKER_URL/api/videos/complete"
            curl -s -X POST "${WORKER_URL}/api/videos/complete" \
                 -H "Content-Type: application/json" \
                 -d "{\"postId\":\"$POST_ID\", \"mediaUrl\":\"$URL\"}"
          else
            echo "WORKER_URL not configured, skipping notification."
          fi
